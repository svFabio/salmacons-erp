<div class="login-wrapper">
  <div class="login-split">
    <!-- Branding Side -->
    <div class="login-brand">
      <div class="brand-content">
        <div class="logo-header">
          <img [src]="brand.logoPath" [alt]="brand.name + ' Logo'" class="logo-icon-large">
          <h1>{{ brand.name }}</h1>
        </div>
        <p>Sistema Integral de Gestión Legal y Técnica para el sector inmobiliario y de construcción.</p>
      </div>
    </div>
    
    <!-- Form Side -->
    <div class="login-form-container">
      <div class="login-card">
        <h2>Bienvenido de nuevo</h2>
        <p class="subtitle">Ingresa tus credenciales para acceder a tu panel.</p>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input id="email" type="email" formControlName="email" placeholder="usuario@salma.com">
          </div>
          
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" formControlName="password" placeholder="••••••••">
          </div>
          
          <div *ngIf="errorMessage" class="error-banner">
            {{ errorMessage }}
          </div>
          
          <button type="submit" class="btn btn-primary login-btn" [disabled]="loginForm.invalid || loading">
            {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
