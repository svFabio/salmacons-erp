name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://salma:salma_dev@localhost:5432/salma?schema=public
      JWT_SECRET: ci-test-secret-not-used-in-production

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salma
          POSTGRES_USER: salma
          POSTGRES_PASSWORD: salma_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salma -d salma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: E2E tests
        run: pnpm run test:e2e
