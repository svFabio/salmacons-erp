services:
  postgres:
    image: postgres:16-alpine
    container_name: salma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salma
      POSTGRES_USER: salma
      POSTGRES_PASSWORD: salma_dev
    ports:
      - "5432:5432"
    volumes:
      - salma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salma -d salma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salma_postgres_data:
