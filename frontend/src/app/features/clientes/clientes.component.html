<div class="clientes-container">
  <div class="table-header">
    <h3>Clients</h3>
    <button class="btn btn-primary" (click)="onNuevoCliente()">+ New Client</button>
  </div>

  <div *ngIf="error" class="error-banner">
    {{ error }}
    <button (click)="error = null">×</button>
  </div>

  <div *ngIf="loading" class="loading-state">
    Loading...
  </div>

  <div *ngIf="!loading && clientes.length === 0" class="empty-state">
    No clients registered yet.
  </div>

  <div *ngIf="!loading && clientes.length > 0" class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>ID</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of clientes">
          <td>{{ c.nombres }} {{ c.apellidos }}</td>
          <td>{{ c.ci }}</td>
          <td>{{ c.email || '—' }}</td>
          <td>{{ c.telefono || '—' }}</td>
          <td class="actions">
            <button class="btn btn-outline btn-sm" (click)="startEdit(c)">Edit</button>
            <button class="btn btn-accent btn-sm" (click)="delete(c.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Drawer overlay -->
<div class="salma-drawer-overlay" *ngIf="showDrawer" (click)="cerrarDrawer()"></div>

<!-- Drawer panel -->
<div class="salma-drawer" [class.open]="showDrawer">
  <div class="drawer-header">
    <h3>{{ editingId ? 'Edit Client' : 'New Client' }}</h3>
    <button class="btn-close" (click)="cerrarDrawer()" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="drawer-body">
    <form [formGroup]="form" id="cliente-form" (ngSubmit)="save()">
      <div class="input-group">
        <label for="nombres">First name(s) *</label>
        <input id="nombres" type="text" formControlName="nombres" placeholder="e.g. Juan Carlos" />
        <span class="field-error" *ngIf="form.get('nombres')?.invalid && form.get('nombres')?.touched">
          Required field.
        </span>
      </div>

      <div class="input-group">
        <label for="apellidos">Last name(s) *</label>
        <input id="apellidos" type="text" formControlName="apellidos" placeholder="e.g. Pérez Gómez" />
        <span class="field-error" *ngIf="form.get('apellidos')?.invalid && form.get('apellidos')?.touched">
          Required field.
        </span>
      </div>

      <div class="input-group">
        <label for="ci">National ID (CI) *</label>
        <input id="ci" type="text" formControlName="ci" placeholder="e.g. 1234567" />
        <span class="field-error" *ngIf="form.get('ci')?.invalid && form.get('ci')?.touched">
          Required field.
        </span>
      </div>

      <div class="divider"><span>Optional</span></div>

      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="email@example.com" />
      </div>

      <div class="input-group">
        <label for="telefono">Phone</label>
        <input id="telefono" type="tel" formControlName="telefono" placeholder="+591 70000000" />
      </div>

      <div class="input-group">
        <label for="direccion">Address</label>
        <textarea id="direccion" formControlName="direccion" placeholder="e.g. Av. América #123" rows="3"></textarea>
      </div>
    </form>
  </div>

  <div class="drawer-footer">
    <button class="btn btn-outline" type="button" (click)="cerrarDrawer()">Cancel</button>
    <button class="btn btn-primary" type="submit" form="cliente-form">
      {{ editingId ? 'Update' : 'Save' }}
    </button>
  </div>
</div>
