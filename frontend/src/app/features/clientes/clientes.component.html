<div class="clientes-container">
  <div class="table-header">
    <h3>Clientes</h3>
    <button class="btn btn-primary" (click)="startCreate()">+ Nuevo Cliente</button>
  </div>

  <div *ngIf="error" class="error-banner">
    {{ error }}
    <button (click)="error = null">×</button>
  </div>

  <div *ngIf="loading" class="loading-state">
    Cargando...
  </div>

  <div *ngIf="!loading && clientes.length === 0" class="empty-state">
    No hay clientes registrados.
  </div>

  <div *ngIf="!loading && clientes.length > 0" class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>CI</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of clientes">
          <td>{{ c.nombres }} {{ c.apellidos }}</td>
          <td>{{ c.ci }}</td>
          <td>{{ c.email || '—' }}</td>
          <td>{{ c.telefono || '—' }}</td>
          <td class="actions">
            <button class="btn btn-outline btn-sm" (click)="startEdit(c)">Editar</button>
            <button class="btn btn-accent btn-sm" (click)="delete(c.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Drawer / Modal Lateral -->
  <div class="salma-drawer-overlay" *ngIf="showDrawer" (click)="cerrarDrawer()"></div>
  <div class="salma-drawer" [class.open]="showDrawer">
    <div class="drawer-header">
      <h3>Nuevo Cliente</h3>
      <button class="btn-close" (click)="cerrarDrawer()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="drawer-body">
      <form class="salma-form">
        <div class="input-group">
          <label>Nombres *</label>
          <input type="text" placeholder="Ej. Juan Carlos" />
        </div>
        <div class="input-group">
          <label>Apellidos *</label>
          <input type="text" placeholder="Ej. Pérez Gómez" />
        </div>
        <div class="input-group">
          <label>Carnet de Identidad (CI) *</label>
          <input type="text" placeholder="Ej. 1234567" />
        </div>
        
        <div class="divider"><span>Opcional</span></div>
        
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="input-group">
          <label>Teléfono</label>
          <input type="tel" placeholder="+591 70000000" />
        </div>
        <div class="input-group">
          <label>Dirección</label>
          <textarea placeholder="Ej. Av. América #123" rows="3"></textarea>
        </div>
      </form>
    </div>

    <div class="drawer-footer">
      <button class="btn btn-outline" (click)="cerrarDrawer()">Cancelar</button>
      <button class="btn btn-primary">Guardar Cliente</button>
    </div>
  </div>

  <div class="card form-card" *ngIf="editingId !== null || form.touched">
    <h4>{{ editingId ? 'Editar Cliente' : 'Nuevo Cliente' }}</h4>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="input-group">
          <label for="nombres">Nombres *</label>
          <input id="nombres" formControlName="nombres" placeholder="Nombres">
        </div>
        <div class="input-group">
          <label for="apellidos">Apellidos *</label>
          <input id="apellidos" formControlName="apellidos" placeholder="Apellidos">
        </div>
        <div class="input-group">
          <label for="ci">CI *</label>
          <input id="ci" formControlName="ci" placeholder="Carnet de identidad">
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input id="email" formControlName="email" type="email" placeholder="email@ejemplo.com">
        </div>
        <div class="input-group">
          <label for="telefono">Teléfono</label>
          <input id="telefono" formControlName="telefono" placeholder="555-0000">
        </div>
        <div class="input-group">
          <label for="direccion">Dirección</label>
          <input id="direccion" formControlName="direccion" placeholder="Dirección">
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" (click)="cancelForm()">Cancelar</button>
        <button type="submit" class="btn btn-primary">
          {{ editingId ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </form>
  </div>
</div>
